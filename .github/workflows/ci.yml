name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run System Monitor
        run: |
          python scripts/01-system-monitor/system-monitor.py

      - name: Run Log Analyzer
        run: |
          python scripts/02-log-analyzer/log-analyzer.py

      - name: Run Backup Script
        run: |
          python scripts/03-backup-script/backup-script.py

      - name: Run API Health Check
        run: |
          python scripts/04-api-health-check/api-health-check.py


  docker-build:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t python-automation-scripts:latest \
            .

      - name: Validate Docker Compose
        run: |
          docker compose config