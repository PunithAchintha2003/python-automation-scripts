name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  test:

    name: Run Python Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run System Monitor
        run: |
          python scripts/01-system-monitor/system-monitor.py

      - name: Run Log Analyzer
        run: |
          python scripts/02-log-analyzer/log-analyzer.py

      - name: Run Backup Script
        run: |
          python scripts/03-backup-script/backup-script.py

      - name: Run API Health Check
        run: |
          python scripts/04-api-health-check/api-health-check.py


  docker-build:

    name: Build Docker Image

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t achintha2003/python-automation-scripts:latest \
            .

      - name: Validate Docker Compose
        run: |
          docker compose config


  docker-push:

    name: Push Image to Docker Hub

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t achintha2003/python-automation-scripts:latest \
            .

      - name: Push Docker Image
        run: |
          docker push \
            achintha2003/python-automation-scripts:latest